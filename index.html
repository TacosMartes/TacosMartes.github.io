<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Próximos</title>
<meta name="application-name" content="Próximos">
<meta name="apple-mobile-web-app-title" content="Próximos">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3A5BFF">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#F2F5FA;--surface:#fff;--ink:#14213D;--muted:#5B6680;--line:#DDE3EE;--accent:#3A5BFF;--accent-ink:#fff;--hot:#FFD23F;--exam:#E5484D;--task:#3A5BFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0C12;--surface:#151A2A;--ink:#EEF1FA;--muted:#9AA5C4;--line:#2A3558;--accent:#7C92FF;--accent-ink:#0F1524;--exam:#FF6B70;--task:#7C92FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0C12;--surface:#151A2A;--ink:#EEF1FA;--muted:#9AA5C4;--line:#2A3558;--accent:#7C92FF;--accent-ink:#0F1524;--exam:#FF6B70;--task:#7C92FF;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:2rem;font-weight:800;margin:8px 0 2px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 16px}
main{position:relative}
.theme{position:absolute;top:14px;right:16px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer}
.bell{width:100%;text-align:left;background:var(--surface);border:1px dashed var(--line);color:var(--ink);padding:10px 12px;border-radius:10px;font:inherit;margin-bottom:8px}
h2{font-size:1.05rem;font-weight:600;margin:24px 0 8px;color:var(--muted)}
h2.hoy{color:var(--ink);background:var(--hot);display:inline-block;padding:2px 10px;border-radius:6px}
h2.late{color:var(--exam)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--task);border-radius:10px;padding:12px}
li.exam{border-left-color:var(--exam)}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--accent);font-size:16px;cursor:pointer}
.chk:hover,.chk:focus-visible{border-color:var(--accent)}
.txt{flex:1;min-width:0}
.t{font-weight:600;overflow-wrap:anywhere}
.m{font-size:.85rem;color:var(--muted)}
.when{font-weight:800;font-size:.9rem;white-space:nowrap}
.del{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:4px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:32px;cursor:pointer;box-shadow:0 6px 18px rgba(20,33,61,.3)}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,420px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,30,.55)}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0}
.seg input{position:absolute;opacity:0;width:0}
.seg span{display:block;text-align:center;padding:10px;border:2px solid var(--line);border-radius:8px;font-weight:600;cursor:pointer}
.seg input:checked+span{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:18px}
.row button{flex:1;font:inherit;font-weight:600;padding:12px;border-radius:8px;border:0;cursor:pointer}
.ok{background:var(--accent);color:var(--accent-ink)}
.no{background:var(--bg);color:var(--ink)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <button class="theme" id="theme" aria-label="Cambiar entre modo claro y oscuro"></button>
  <h1>Próximos</h1>
  <p class="sub" id="sub"></p>
  <button class="bell" id="bell" hidden>🔔 Activar avisos en este dispositivo</button>
  <button class="bell" id="ics">📥 Descargar todo como calendario (.ics)</button>
  <div id="list"></div>
</main>
<button class="fab" id="add" aria-label="Añadir examen o tarea">+</button>

<dialog id="dlg">
  <form id="f" method="dialog">
    <label for="title">¿Qué tienes que hacer?</label>
    <input id="title" required maxlength="80" placeholder="Examen tema 4">
    <label for="date">Fecha</label>
    <input id="date" type="date" required>
    <label for="time">Hora (opcional, por defecto 09:00)</label>
    <input id="time" type="time">
    <label>Tipo</label>
    <div class="seg">
      <label><input type="radio" name="type" value="exam" checked><span>Examen</span></label>
      <label><input type="radio" name="type" value="task"><span>Tarea</span></label>
    </div>
    <label for="subject">Asignatura (opcional)</label>
    <input id="subject" maxlength="40" placeholder="Matemáticas">
    <div class="row">
      <button type="button" class="no" id="cancel">Cancelar</button>
      <button type="submit" class="ok">Guardar</button>
    </div>
  </form>
</dialog>

<script>
/* Registro del service worker */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{ /* fallar silenciosamente si no hay SW */ });
}

/* Resto de tu JS original (sin cambios) */
const KEY='proximos:v1', NKEY='proximos:avisados';
const AVISOS={exam:[7,3,1,0],task:[1,0]};
let items=[];
try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
const $=id=>document.getElementById(id);

function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function diff(s){const [y,m,d]=s.split('-').map(Number);return Math.round((new Date(y,m-1,d)-today())/864e5)}
function label(n){
  if(n<0)return n===-1?'ayer':`hace ${-n} d`;
  if(n===0)return 'hoy'; if(n===1)return 'mañana'; return `en ${n} días`;
}
function fmt(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})}
function esc(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function render(){
  const pend=items.filter(i=>!i.done).sort((a,b)=>a.date.localeCompare(b.date));
  const groups=[['Vencido','late',x=>x<0],['Hoy','hoy',x=>x===0],['Mañana','',x=>x===1],['Esta semana','',x=>x>=2&&x<=7],['Más adelante','',x=>x>7]];
  let html='';
  groups.forEach(([name,cls,test])=>{
    const g=pend.filter(i=>test(diff(i.date)));
    if(!g.length)return;
    html+=`<h2 class="${cls}">${name}</h2><ul>`+g.map(i=>`
      <li class="${i.type}">
        <button class="chk" data-done="${i.id}" aria-label="Marcar como hecho: ${esc(i.title)}">✓</button>
        <div class="txt"><div class="t">${esc(i.title)}</div>
        <div class="m">${i.type==='exam'?'Examen':'Tarea'}${i.subject?' · '+esc(i.subject):''} · ${fmt(i.date)}${i.time?' '+i.time:''}</div></div>
        <div class="when">${label(diff(i.date))}</div>
        <button class="del" data-del="${i.id}" aria-label="Borrar ${esc(i.title)}">×</button>
      </li>`).join('')+'</ul>';
  });
  $('list').innerHTML=html||'<div class="empty">Nada pendiente.<br>Pulsa + para añadir un examen o una tarea.</div>';
  const soon=pend.filter(i=>diff(i.date)>=0&&diff(i.date)<=3).length;
  $('sub').textContent=soon?`${soon} ${soon===1?'cosa':'cosas'} en los próximos 3 días`:'Nada urgente por ahora';
}

$('list').addEventListener('click',e=>{
  const d=e.target.closest('[data-done]'),x=e.target.closest('[data-del]');
  if(d){items.find(i=>i.id===d.dataset.done).done=true}
  else if(x){const it=items.find(i=>i.id===x.dataset.del);
    items=items.filter(i=>i.id!==x.dataset.del)}
  else return;
  save();render();
});

$('add').onclick=()=>{$('f').reset();$('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);$('dlg').showModal();$('title').focus()};
$('cancel').onclick=()=>$('dlg').close();
$('f').addEventListener('submit',()=>{
  items.push({id:Date.now().toString(36),title:$('title').value.trim(),date:$('date').value,
    type:document.querySelector('input[name=type]:checked').value,subject:$('subject').value.trim(),time:$('time').value,done:false});
  save();render();checkAvisos();
});

function checkAvisos(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  let sent={};try{sent=JSON.parse(localStorage.getItem(NKEY)||'{}')}catch(e){}
  items.filter(i=>!i.done).forEach(i=>{
    const n=diff(i.date);
    if(!AVISOS[i.type].includes(n))return;
    const k=`${i.id}:${n}`; if(sent[k])return;
    try{new Notification(`${i.type==='exam'?'Examen':'Tarea'}: ${i.title}`,{body:`${label(n)[0].toUpperCase()+label(n).slice(1)} · ${i.subject||fmt(i.date)}`});sent[k]=1}catch(e){}
  });
  try{localStorage.setItem(NKEY,JSON.stringify(sent))}catch(e){}
}
if('Notification' in window&&Notification.permission==='default'){
  $('bell').hidden=false;
  $('bell').onclick=async()=>{try{await Notification.requestPermission()}catch(e){}$('bell').hidden=true;checkAvisos()};
}
const REMIND={exam:[10080,4320,1440,0],task:[1440,0]};
const p2=n=>String(n).padStart(2,'0');

function icsEsc(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function icsLocal(t){return `${t.getFullYear()}${p2(t.getMonth()+1)}${p2(t.getDate())}T${p2(t.getHours())}${p2(t.getMinutes())}00`}
function exportIcs(){
  const pend=items.filter(i=>!i.done&&diff(i.date)>=0);
  if(!pend.length){alert('No hay nada pendiente que exportar.');return}
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Proximos//ES','CALSCALE:GREGORIAN'];
  pend.forEach(i=>{
    const [y,m,d]=i.date.split('-').map(Number),[hh,mm]=(i.time||'09:00').split(':').map(Number);
    const a=new Date(y,m-1,d,hh,mm),b=new Date(a.getTime()+36e5);
    L.push('BEGIN:VEVENT',`UID:${i.id}@proximos`,`DTSTAMP:${stamp}`,`DTSTART:${icsLocal(a)}`,`DTEND:${icsLocal(b)}`,
      `SUMMARY:${icsEsc((i.type==='exam'?'Examen':'Tarea')+': '+i.title)}`);
    if(i.subject)L.push(`DESCRIPTION:${icsEsc(i.subject)}`);
    REMIND[i.type].forEach(min=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Recordatorio',min?`TRIGGER:-PT${min}M`:'TRIGGER:PT0M','END:VALARM'));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const blob=new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='proximos.ics';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('ics').onclick=exportIcs;

const TKEY='proximos:tema';
function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function paintTheme(){$('theme').textContent=isDark()?'☀️':'🌙'}
try{const t=localStorage.getItem(TKEY);if(t)document.documentElement.dataset.theme=t}catch(e){}
$('theme').onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem(TKEY,t)}catch(e){}paintTheme()};
paintTheme();
render();checkAvisos();setInterval(()=>{render();checkAvisos()},60000);
</script>
</body>
</html>
